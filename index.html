<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>days until i make $1 on social media</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>days until i make $1 on social media</h1>
      <div class="stats">
        <div class="stat">
          <span class="stat-number" id="day-count">—</span>
          <span class="stat-label">days counting</span>
        </div>
      </div>
      <div class="legend">
        <span class="legend-item"><span class="dot start"></span> start date</span>
        <span class="legend-item"><span class="dot counted"></span> day passed</span>
        <span class="legend-item"><span class="dot milestone"></span> made $1</span>
      </div>
    </header>
    <section id="growth">
      <div class="chart-wrap"><canvas id="growth-chart"></canvas></div>
      <p id="growth-empty" class="loading" hidden>No follower data yet — check back after the first daily collection.</p>
    </section>
    <main id="calendar"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="app.js"></script>
</body>
</html>
